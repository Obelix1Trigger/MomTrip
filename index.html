<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Message for Mom ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>❤️</span>
        <span>💕</span>
    </div>

    <main class="welcome-page">

        <div class="card">

            <div class="heart-icon">💗</div>

            <p class="small-text">
                A LITTLE MESSAGE FOR
            </p>

            <h1>
                Hello Mom! 👋❤️
            </h1>

            <p class="message">
                I have something special I'd like to ask you...
            </p>

            <p class="sub-message">
                It's not a long speech, I promise 😂
                <br>
                Just click below to find out.
            </p>

            <button
                class="next-button"
                onclick="goToQuestion()"
            >
                Continue
                <span>→</span>
            </button>

            <p class="bottom-text">
                Made with ❤️ by your son
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
